<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VIBELAND</title>
<style>
:root{box-sizing:border-box;color-scheme:dark;--g:#b6ff3b;--bg:rgba(8,20,14,.84)}
body{margin:0;overflow:hidden;background:#0a3d4a;font:14px system-ui,sans-serif;color:#e8ffe0}
canvas{display:block}.hide{display:none!important}
.p{position:fixed;background:var(--bg);border:1px solid #b6ff3b55;border-radius:10px;padding:8px 12px}
#tl{top:calc(10px + env(safe-area-inset-top,0px));left:10px}#tr{top:calc(10px + env(safe-area-inset-top,0px));right:10px;text-align:right}
#tl b{color:var(--g);font-size:18px;letter-spacing:1px}
#q{top:calc(78px + env(safe-area-inset-top,0px));left:10px;width:230px}
.bar{height:8px;background:#1b2e22;border-radius:5px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--g);width:0}
#pr{bottom:64px;left:50%;transform:translateX(-50%);text-align:center;max-width:86vw}
#bt{bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:96vw}
.b{background:#143d1d;color:var(--g);border:1px solid #b6ff3b88;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}.b:hover{background:#1f5a2c}.b:disabled{opacity:.4;cursor:default}
#hint{bottom:calc(10px + 44px);right:10px;font-size:12px;opacity:.8;text-align:right}
#toasts{position:fixed;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:300px}
.t{background:var(--bg);border-left:4px solid var(--g);padding:6px 10px;border-radius:6px;animation:fi .2s}
.lb{position:fixed;transform:translate(-50%,-100%);font-size:12px;background:#000a;border-radius:6px;padding:2px 6px;pointer-events:none;white-space:nowrap;color:#fff}
.ft{position:fixed;transform:translate(-50%,-50%);font-weight:700;font-size:16px;pointer-events:none;text-shadow:0 1px 3px #000;animation:up 1.2s forwards}
#lv{position:fixed;top:30%;left:50%;transform:translateX(-50%);font-size:40px;font-weight:800;color:var(--g);text-shadow:0 0 20px #7f0;text-align:center;pointer-events:none;animation:up2 2.4s forwards}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20}
#mb{width:min(660px,94vw);max-height:86vh;overflow:auto;background:#0d1f14;border:2px solid var(--g);border-radius:14px;padding:16px}
#mb h2{margin:0 0 8px;color:var(--g)}.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #b6ff3b22}.it small{opacity:.75;display:block}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}@keyframes up2{0%{opacity:0;top:36%}15%{opacity:1}80%{opacity:1}100%{opacity:0;top:24%}}@keyframes fi{from{opacity:0;transform:translateX(-10px)}}
